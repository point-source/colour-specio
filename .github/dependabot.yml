# Dependabot version-update PRs. Complements (does not replace) Dependabot
# security updates, which open PRs for vulnerability alerts independently.
version: 2
updates:
  # Moves uv.lock, and touches pyproject.toml only when a release crosses a
  # bound. `build(deps):` keeps each PR typed as a build change, and a
  # release has a week to draw a follow-up fix before it is proposed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    # ruff and pyright bring new findings that need code edits, so they do
    # not hold up the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "pyright"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pyright"]
    commit-message:
      prefix: "build"
      include: "scope"
